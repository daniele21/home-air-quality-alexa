[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-air-quality-alexa"
version = "0.1.0"
description = "Local Alexa air-quality measurements collector"
requires-python = ">=3.12"
dependencies = [
    "aioamazondevices==17.2.3",
    "aiohttp>=3.14.5,<4",
    "httpx[http2]>=0.28,<1",
]

[project.scripts]
air-quality-alexa = "home_air_quality_alexa.collector:main"

[tool.setuptools.packages.find]
where = ["src"]
